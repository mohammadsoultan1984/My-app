<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ff69b4">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="حاسبة الأميرات">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎀</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%23ff85c0%22/><text x=%2250%%22 y=%2255%%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%2265%22>🎀</text></svg>">
  <title>حاسبة الأميرات 🎀</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      margin: 0;
      padding: 15px;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffd6e8 0%, #fce4ec 50%, #f3e5f5 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .calculator {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 32px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(255, 105, 180, 0.25);
      border: 4px solid #ffb6c1;
      position: relative;
    }
    .header {
      text-align: center;
      color: #d81b60;
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .screen {
      background: #fff0f6;
      border: 3px solid #ffadd2;
      border-radius: 22px;
      padding: 15px 18px;
      margin-bottom: 16px;
      text-align: left;
      direction: ltr;
      min-height: 105px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: inset 0 3px 6px rgba(255, 105, 180, 0.1);
    }
    .equation {
      font-size: 1.2rem;
      color: #ad1457;
      min-height: 24px;
      opacity: 0.75;
      word-wrap: break-word;
    }
    .result {
      font-size: 2.5rem;
      font-weight: bold;
      color: #880e4f;
      word-wrap: break-word;
    }
    .message {
      text-align: center;
      min-height: 26px;
      font-size: 1.05rem;
      font-weight: bold;
      color: #ec407a;
      margin-bottom: 12px;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      direction: ltr;
    }
    button {
      border: none;
      border-radius: 20px;
      padding: 18px 0;
      font-size: 1.6rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.1);
    }
    button:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.1);
    }
    .btn-num {
      background: #fce4ec;
      color: #880e4f;
      border: 2px solid #f8bbd0;
    }
    .btn-op {
      background: linear-gradient(145deg, #ff80ab, #f50057);
      color: white;
      font-size: 2rem;
    }
    .btn-clear {
      background: #ce93d8;
      color: #4a148c;
      font-size: 1.25rem;
      grid-column: span 2;
    }
    .btn-back {
      background: #f48fb1;
      color: #880e4f;
      font-size: 1.4rem;
      grid-column: span 2;
    }
    .btn-zero {
      grid-column: span 2;
    }
    .btn-equal {
      background: linear-gradient(145deg, #ab47bc, #7b1fa2);
      color: white;
      grid-column: span 2;
      font-size: 2rem;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="header">🌸 حاسبة الأميرات 🎀</div>
    <div class="screen">
      <div class="equation" id="equation"></div>
      <div class="result" id="display">0</div>
    </div>
    <div class="message" id="msg">هيا نحسب معاً! ✨</div>

    <div class="buttons">
      <button class="btn-clear" onclick="clearAll()">مسح 🧹</button>
      <button class="btn-back" onclick="backspace()">تراجع ⌫</button>

      <button class="btn-num" onclick="appendNum('7')">7</button>
      <button class="btn-num" onclick="appendNum('8')">8</button>
      <button class="btn-num" onclick="appendNum('9')">9</button>
      <button class="btn-op" onclick="chooseOp('+')" title="جمع">+</button>

      <button class="btn-num" onclick="appendNum('4')">4</button>
      <button class="btn-num" onclick="appendNum('5')">5</button>
      <button class="btn-num" onclick="appendNum('6')">6</button>
      <button class="btn-op" onclick="chooseOp('-')" title="طرح">−</button>

      <button class="btn-num" onclick="appendNum('1')">1</button>
      <button class="btn-num" onclick="appendNum('2')">2</button>
      <button class="btn-num" onclick="appendNum('3')">3</button>
      <button class="btn-op" onclick="chooseOp('+')" title="جمع">+</button>

      <button class="btn-num btn-zero" onclick="appendNum('0')">0</button>
      <button class="btn-equal" onclick="calculate()">= 💖</button>
    </div>
  </div>

  <script>
    let current = '0';
    let previous = '';
    let operation = null;
    let resetNext = false;

    const displayEl = document.getElementById('display');
    const equationEl = document.getElementById('equation');
    const msgEl = document.getElementById('msg');

    const praises = [
      'شطورة يا أميرة! 🌸',
      'إجابة رائعة! 💖',
      'ممتازة جداً! ✨',
      'أحسنتِ يا جميلة! 🎀',
      'ذكية ومميزة! 🦄'
    ];

    // صوت لطيف عند الضغط على الأزرار
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq = 600, duration = 0.08) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function updateScreen() {
      displayEl.textContent = current;
      if (operation != null) {
        equationEl.textContent = `${previous}${operation === '+' ? '+' : '−'}`;
      } else {
        equationEl.textContent = '';
      }
    }

    function appendNum(num) {
      playTone(550, 0.07);
      if (current === '0' || resetNext) {
        current = num;
        resetNext = false;
      } else if (current.length < 10) {
        current += num;
      }
      updateScreen();
    }

    function chooseOp(op) {
      playTone(700, 0.09);
      if (operation !== null && !resetNext) {
        calculate(false);
      }
      previous = current;
      operation = op;
      resetNext = true;
      msgEl.textContent = op === '+' ? 'عملية جمع ➕🌸' : 'عملية طرح ➖🌸';
      updateScreen();
    }

    function calculate(showPraise = true) {
      if (operation === null || resetNext) return;
      const prev = parseFloat(previous);
      const curr = parseFloat(current);
      if (isNaN(prev) || isNaN(curr)) return;

      let result = 0;
      if (operation === '+') {
        result = prev + curr;
      } else if (operation === '-') {
        result = prev - curr;
      }

      equationEl.textContent = `${previous} ${operation === '+' ? '+' : '−'}${current} =`;
      current = String(result);
      operation = null;
      previous = '';
      resetNext = true;
      displayEl.textContent = current;

      if (showPraise) {
        playTone(880, 0.18);
        const randomPraise = praises[Math.floor(Math.random() * praises.length)];
        msgEl.textContent = randomPraise;
      }
    }

    function clearAll() {
      playTone(400, 0.1);
      current = '0';
      previous = '';
      operation = null;
      resetNext = false;
      msgEl.textContent = 'هيا نحسب من جديد! ✨';
      updateScreen();
    }

    function backspace() {
      playTone(480, 0.07);
      if (resetNext) return;
      if (current.length > 1) {
        current = current.slice(0, -1);
      } else {
        current = '0';
      }
      updateScreen();
    }
  </script>
</body>
</html>
