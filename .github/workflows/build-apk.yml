name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate Android WebView Project
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/princess/calc
          cp index.html app/src/main/assets/index.html

          printf 'rootProject.name = "PrincessCalc"\ninclude ":app"\n' > settings.gradle

          printf 'buildscript {\n  repositories { google(); mavenCentral() }\n  dependencies { classpath "com.android.tools.build:gradle:8.1.0" }\n}\nallprojects { repositories { google(); mavenCentral() } }\n' > build.gradle

          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2048m\n' > gradle.properties

          printf 'apply plugin: "com.android.application"\nandroid {\n  namespace "com.princess.calc"\n  compileSdk 34\n  defaultConfig {\n    applicationId "com.princess.calc"\n    minSdk 21\n    targetSdk 34\n    versionCode 1\n    versionName "1.0"\n  }\n  buildTypes {\n    debug { minifyEnabled false }\n  }\n}\n' > app/build.gradle

          printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n  <application android:label="حاسبة الأميرات" android:theme="@android:style/Theme.NoTitleBar">\n    <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">\n      <intent-filter>\n        <action android:name="android.intent.action.MAIN" />\n        <category android:name="android.intent.category.LAUNCHER" />\n      </intent-filter>\n    </activity>\n  </application>\n</manifest>\n' > app/src/main/AndroidManifest.xml

          printf 'package com.princess.calc;\nimport android.app.Activity;\nimport android.os.Bundle;\nimport android.webkit.WebSettings;\nimport android.webkit.WebView;\npublic class MainActivity extends Activity {\n  @Override\n  protected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    WebView webView = new WebView(this);\n    WebSettings settings = webView.getSettings();\n    settings.setJavaScriptEnabled(true);\n    settings.setDomStorageEnabled(true);\n    webView.loadUrl("file:///android_asset/index.html");\n    setContentView(webView);\n  }\n}\n' > app/src/main/java/com/princess/calc/MainActivity.java

          gradle assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk princess-calculator.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "حاسبة الأميرات APK"
          files: princess-calculator.apk
